[mcp_servers.godot]
command = "C:/1/npx.cmd"
args = ["--yes", "@satelliteoflove/godot-mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 60
default_tools_approval_mode = "prompt"
enabled_tools = [
  "godot_editor_read",
  "godot_node_read",
  "godot_project",
  "godot_resource",
  "godot_docs",
  "godot_runtime_state",
  "godot_game_time",
  "godot_input",
  "godot_profiler",
  "godot_validate_meshes"
]
